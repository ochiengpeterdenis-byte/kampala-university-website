
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply Now | Kampala University</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
    <div class="university-logo">
        <img src="images/logo.png" alt="Kampala University Logo"
             class="logo-image">
        <div>
            <h2>KAMPALA UNIVERSITY</h2>
            <p>We Strive For Excellence</p>
        </div>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="academics.html">Academics</a>
        <a href="admissions.html">Admissions</a>
        <a href="apply.html" class="active">Apply Now</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<main class="application-page">

    <h1>Student Application Form</h1>
    <p class="form-intro">
        Complete the form below to begin your application.
    </p>

    <form id="applicationForm">

        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" name="fullName"
               placeholder="Enter your full name" required>

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email"
               placeholder="Enter your email address" required>

        <label for="phone">Telephone Number</label>
        <input type="tel" id="phone" name="phone"
               placeholder="Enter your telephone number" required>

        <label for="gender">Gender</label>
        <select id="gender" name="gender" required>
            <option value="">Select gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Prefer not to say">Prefer not to say</option>
        </select>

        <label for="programme">Programme of Interest</label>
        <select id="programme" name="programme" required>
            <option value="">Select a programme</option>
            <option value="Diploma in Software Engineering">
                Diploma in Software Engineering
            </option>
            <option value="Bachelor of Business Administration">
                Bachelor of Business Administration
            </option>
            <option value="Bachelor of Education">
                Bachelor of Education
            </option>
            <option value="Other">Other programme</option>
        </select>

        <label for="qualification">Highest Academic Qualification</label>
        <select id="qualification" name="qualification" required>
            <option value="">Select qualification</option>
            <option value="UCE">UCE</option>
            <option value="UACE">UACE</option>
            <option value="Certificate">Certificate</option>
            <option value="Diploma">Diploma</option>
            <option value="Degree">Degree</option>
            <option value="Other">Other</option>
        </select>

        <button type="submit" class="apply-button">
            SUBMIT APPLICATION
        </button>

        <p id="applicationMessage" role="status"></p>

    </form>

    <a href="admissions.html" class="back-link">
        Back to Admissions
    </a>

</main>

<footer>
    <p>&copy; 2026 Kampala University Website Project.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
